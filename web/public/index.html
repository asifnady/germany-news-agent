<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Germany News</title>
<style>
  :root{ --bg:#0e1116; --card:#161b23; --text:#e6e9ee; --accent:#4da3ff; }
  body{ background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:20px; }
  .controls{ margin-bottom:20px; display:flex; gap:10px; align-items:center; }
  .article{ background:var(--card); padding:15px; margin-bottom:10px; border-radius:8px; }
</style>
</head>
<body>
  <div class="controls">
    <div style="margin-bottom: 20px;">
      <label for="zip-code">Region / Zip Code:</label>
      <input type="text" id="zip-code" placeholder="e.g., 82256" style="padding: 5px;">
      <button onclick="saveZip()">Save</button>
    </div>
    <button id="refresh" title="Refresh">?</button>
  </div>
  <div id="news-container"></div>
  <script>
    function saveZip() { alert("Zip code saved: " + document.getElementById("zip-code").value); }
  </script>
</body>
</html>
